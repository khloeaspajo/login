<!DOCTYPE html>

<head>

<title>Login</title>

<style>

body{
  background-color: #aa96dd;
  font-family: Arial;
}


#pri{
  width: 850px;
  height: 450px;
  margin: 100px auto;
  background-color: white;
  border-radius: 15px;
}


#esq{
  width: 50%;
  height: 100%;
  background-color: #7045bd;
  float: left;
  padding: 40px;
  box-sizing: border-box;
  color: white;
}


#dir{
  width: 50%;
  height: 100%;
  background-color: white;
  float: right;
  padding: 70px 45px;
  box-sizing: border-box;
}


#tit{
  margin-top: 100px;
  font-size: 35px;
}


#txt{
  margin-top: 20px;
  font-size: 16px;
}


#entrar{
  font-size: 30px;
  margin-bottom: 25px;
}


#user{
  width: 100%;
  height: 40px;
  margin-bottom: 15px;
  border: 1px solid #dddddd;
  border-radius: 20px;
  padding: 10px;
  box-sizing: border-box;
}


#senh{
  width: 100%;
  height: 40px;
  margin-bottom: 15px;
  border: 1px solid #dddddd;
  border-radius: 20px;
  padding: 10px;
  box-sizing: border-box;
}


#check{
  float: left;
  margin-right: 5px;
}


#lem{
  font-size: 12px;
  margin-bottom: 20px;
}


#esqsenha{
  float: right;
}


#bot{
  background-color: #7045bd;
  color: white;
  text-align: center;
  padding: 12px;
  border-radius: 20px;
}


#conta{
  text-align: center;
  font-size: 12px;
  margin-top: 20px;
}


#cad{
  color: #7045bd;
}

</style>

</head>


<body>


<div id="pri">


  <div id="esq">

    <div id="tit">
      Bem-vindo de volta!
    </div>

    <div id="txt">
      Você pode entrar para acessar
      sua conta.
    </div>

  </div>


  <div id="dir">

    <div id="entrar">
      Entrar
    </div>


    <input id="user" type="text" placeholder="Usuário ou email">


    <input id="sen" type="password" placeholder="Senha">


    <div id="lem">

      <input id="check" type="checkbox">

      Lembrar de mim

      <span id="esqsenha">
        Esqueci minha senha
      </span>

    </div>


    <div id="bot">
      Entrar
    </div>


    <div id="conta">
      Ainda não tem uma conta?

      <span id="cad">
        Criar uma conta
      </span>

    </div>


  </div>


</div>


</body>

</html>
